[pytest]
# Trusted runner configuration for AICRG's own trusted evidence (read from the base
# commit by the gate). Using -c with this file ignores pyproject.toml pytest options.
# pythonpath is relative to THIS file: it must resolve to the checkout under review,
# never to an installed copy of aicrg.
pythonpath = ../src ..
addopts = -q
markers =
    slow: end-to-end tests that build git repositories and run commands
