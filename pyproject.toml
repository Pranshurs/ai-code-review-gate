[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-code-review-gate"
version = "0.1.0.dev0"
description = "Independent acceptance evidence for AI-generated code: a deterministic merge gate that binds patch, policy and evidence into a receipt."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Pranshu" }]
keywords = ["code-review", "ci", "merge-gate", "ai-agents", "test-integrity", "supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "build"]

[project.scripts]
aicrg = "aicrg.cli:main"

[project.urls]
Source = "https://github.com/Pranshurs/ai-code-review-gate"

[tool.hatch.build.targets.wheel]
packages = ["src/aicrg"]

[tool.hatch.build.targets.sdist]
include = ["/src/aicrg", "/tests", "/docs", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["corpus"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "PL"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW2901",
  "S603",    # subprocess without shell is the point of evidence execution; argv is validated
  "S607",    # git/tools are resolved from PATH by design (documented trust assumption)
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PLC0415", "E501", "PLR0917"]
"src/aicrg/cli.py" = ["PLC0415"]  # lazy imports keep `aicrg --version` fast
"scripts/**" = ["S101", "T201", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/aicrg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the code under test from this checkout, never from an installed copy:
# the gate runs this suite inside a worktree of the commit being judged.
pythonpath = ["src"]
addopts = "-q"
markers = ["slow: end-to-end tests that build git repositories and run commands"]
