name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only token everywhere; no job needs to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -q -e '.[dev]'
      - run: ruff check src tests corpus/run_corpus.py corpus/run_realworld.py scripts
      - run: ruff format --check src tests corpus/run_corpus.py corpus/run_realworld.py scripts
      - run: mypy
      - name: aicrg doctor on this repository (static; UNKNOWN or FAIL fails the job)
        run: aicrg doctor

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -q -e '.[dev]'
      - name: Pull the image used by the container-isolation tests
        run: docker pull python:3.12-slim
      - run: python -m pytest -q -p no:cacheprovider
        env:
          AICRG_REQUIRE_DOCKER: "1"  # a missing runtime fails the job instead of skipping

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -q -e '.[dev]'
      - name: Development corpus (must match every expectation)
        run: python corpus/run_corpus.py corpus/dev --out corpus-results
      - name: Held-out v1 (post-hoc; ratchet on the 6 recorded misses)
        run: python corpus/run_corpus.py corpus/heldout --out corpus-results --allow-mismatches 6
      - name: Held-out v2 (blind; ratchet on the 10 recorded mismatches)
        run: python corpus/run_corpus.py corpus/heldout-v2 --out corpus-results --allow-mismatches 10
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: corpus-results
          path: corpus-results/

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -q -e '.[dev]'
      - run: docker pull python:3.12-slim
      - run: python scripts/mutation_gate.py
        env:
          AICRG_REQUIRE_DOCKER: "1"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -q build
      - run: python -m build
      - name: Install the wheel in a clean venv and smoke-test it
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install -q dist/*.whl
          /tmp/wheel-venv/bin/aicrg --version
          /tmp/wheel-venv/bin/aicrg policy validate review-gate.yaml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the full history
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -q bandit pip-audit
      - run: bandit -q -r src -ll
      - run: pip-audit --strict .
      - name: Secret scan of the full history (gitleaks, checksum-pinned)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --no-banner --redact --config .gitleaks.toml .

  # The gate reviews its own pull requests. Runs on `pull_request` (never
  # pull_request_target): fork code gets a read-only token and no secrets.
  # This is dogfooding, not enforcement: `uses: ./` runs the PR's own copy of the
  # gate. Enforcement needs a ruleset-required workflow (docs/GITHUB_ACTIONS.md).
  self-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # The gate's required checks include the test suite and mutation gate,
      # whose container tests need this image. Without it they would skip and
      # container-only mutants would survive (observed on PR #1, run 23).
      AICRG_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -q -e '.[dev]'
      - name: Pull the image used by the container-isolation tests
        run: docker pull python:3.12-slim
      - uses: ./
        with:
          policy: review-gate.yaml
