name: AI Code Review Gate
description: >
  Independent acceptance evidence for AI-generated code. Evaluates base..head against a
  review contract, runs the required checks, and uploads a sealed gate receipt.
branding:
  icon: shield
  color: gray-dark

inputs:
  base:
    description: "Base revision (default: the pull request base SHA)."
    required: false
    default: ""
  head:
    description: "Head revision (default: the pull request head SHA, else HEAD)."
    required: false
    default: ""
  policy:
    description: "Review contract path, read from the BASE commit (default review-gate.yaml if present)."
    required: false
    default: ""
  executor:
    description: "Evidence executor: '' (use the contract), 'local' or 'container'. Can only make the base contract stricter."
    required: false
    default: ""
  container-image:
    description: "Image for executor 'container' when the contract names none (pin by digest)."
    required: false
    default: ""
  python-version:
    description: "Python used to run the gate."
    required: false
    default: "3.12"
  receipt-artifact:
    description: "Name of the uploaded receipt artifact."
    required: false
    default: aicrg-receipt

outputs:
  decision:
    description: "PASS, FAIL, REVIEW_REQUIRED or ERROR."
    value: ${{ steps.gate.outputs.decision }}
  receipt:
    description: "Path of the receipt file on the runner."
    value: ${{ steps.gate.outputs.receipt }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install AI Code Review Gate (from this action's own checkout)
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check -q "$ACTION_PATH"

    - name: Run gate
      id: gate
      shell: bash
      # Inputs are passed through the environment, never interpolated into the
      # script, so a crafted branch name or input cannot inject shell.
      env:
        IN_BASE: ${{ inputs.base }}
        IN_HEAD: ${{ inputs.head }}
        IN_POLICY: ${{ inputs.policy }}
        IN_EXECUTOR: ${{ inputs.executor }}
        IN_IMAGE: ${{ inputs.container-image }}
        PR_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      run: |
        set -u
        base="${IN_BASE:-${PR_BASE:-}}"
        head="${IN_HEAD:-${PR_HEAD:-HEAD}}"
        if [ -z "$base" ]; then
          echo "::error::no base revision: set the 'base' input or run on pull_request/merge_group"
          echo "decision=ERROR" >> "$GITHUB_OUTPUT"
          exit 4
        fi
        args=(check --base "$base" --head "$head" --receipt "$RUNNER_TEMP/aicrg/review-receipt.json"
              --summary-file "$GITHUB_STEP_SUMMARY")
        if [ -n "$IN_POLICY" ]; then args+=(--policy "$IN_POLICY"); fi
        if [ -n "$IN_EXECUTOR" ]; then args+=(--executor "$IN_EXECUTOR"); fi
        if [ -n "$IN_IMAGE" ]; then args+=(--container-image "$IN_IMAGE"); fi
        echo "receipt=$RUNNER_TEMP/aicrg/review-receipt.json" >> "$GITHUB_OUTPUT"
        status=0
        aicrg "${args[@]}" || status=$?
        decision=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["decision"])' \
          "$RUNNER_TEMP/aicrg/review-receipt.json" 2>/dev/null || echo ERROR)
        echo "decision=$decision" >> "$GITHUB_OUTPUT"
        exit "$status"

    - name: Upload receipt
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.receipt-artifact }}
        path: ${{ runner.temp }}/aicrg/review-receipt.json
        if-no-files-found: warn
